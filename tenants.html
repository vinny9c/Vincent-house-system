<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent House System - Manage Tenants</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #007acc;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        input:focus, select:focus {
            border-color: #007acc;
            outline: none;
        }
        .btn-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-add { background-color: #28a745; color: white; }
        .btn-update { background-color: #ffc107; color: #111; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-dash { background-color: #6c757d; color: white; margin-left: auto; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { color: #007acc; background-color: #252525; }
        tr:hover { background-color: #2a2a2a; cursor: pointer; }
        tr.selected { background-color: #007acc33 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Manage Tenants</h2>
    
    <div class="form-grid">
        <input type="hidden" id="tenantId">
        <div class="input-group">
            <label>TENANT NAME</label>
            <input type="text" id="tenantName">
        </div>
        <div class="input-group">
            <label>PHONE NO.</label>
            <input type="text" id="phoneNo">
        </div>
        <div class="input-group">
            <label>EMAIL ADDRESS</label>
            <input type="email" id="emailAddress">
        </div>
        <div class="input-group">
            <label>ASSIGNED PROPERTY</label>
            <input type="text" id="assignedProperty">
        </div>
        <div class="input-group">
            <label>HOUSE NUMBER</label>
            <input type="text" id="houseNumber">
        </div>
    </div>

    <div class="btn-bar">
        <button class="btn-add" id="addBtn">ADD</button>
        <button class="btn-update" id="updateBtn">UPDATE</button>
        <button class="btn-delete" id="deleteBtn">DELETE</button>
        <button class="btn-dash" onclick="location.href='dashboard.html'">DASHBOARD</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Tenant Name</th>
                <th>Phone No.</th>
                <th>Email</th>
                <th>Property</th>
                <th>House No.</th>
            </tr>
        </thead>
        <tbody id="tenantsTable">
            <!-- Data maps here -->
        </tbody>
    </table>
</div>

<script>
    // Browser local storage representation of old MDB tenant data rows
    let tenants = JSON.parse(localStorage.getItem('tenants')) || [
        { id: 1, name: "Benjamin Menthu", phone: "0711222333", email: "ben@test.com", property: "Oakridge Apartments", houseNo: "4B" }
    ];
    let selectedId = null;

    const tableBody = document.getElementById('tenantsTable');

    function renderTable() {
        tableBody.innerHTML = '';
        tenants.forEach(t => {
            const tr = document.createElement('tr');
            if(selectedId === t.id) tr.classList.add('selected');
            tr.innerHTML = `<td>${t.name}</td><td>${t.phone}</td><td>${t.email}</td><td>${t.property}</td><td>${t.houseNo}</td>`;
            
            // Grid interaction loop sync mapping
            tr.addEventListener('click', () => {
                selectedId = t.id;
                document.getElementById('tenantId').value = t.id;
                document.getElementById('tenantName').value = t.name;
                document.getElementById('phoneNo').value = t.phone;
                document.getElementById('emailAddress').value = t.email;
                document.getElementById('assignedProperty').value = t.property;
                document.getElementById('houseNumber').value = t.houseNo;
                renderTable();
            });
            tableBody.appendChild(tr);
        });
        localStorage.setItem('tenants', JSON.stringify(tenants));
    }

    // Add function
    document.getElementById('addBtn').addEventListener('click', () => {
        const name = document.getElementById('tenantName').value.trim();
        if(!name) return alert("Please specify tenant name.");
        
        tenants.push({
            id: Date.now(),
            name: name,
            phone: document.getElementById('phoneNo').value.trim(),
            email: document.getElementById('emailAddress').value.trim(),
            property: document.getElementById('assignedProperty').value.trim(),
            houseNo: document.getElementById('houseNumber').value.trim()
        });
        alert("Tenant added successfully.");
        clearForm();
    });

    // Update function
    document.getElementById('updateBtn').addEventListener('click', () => {
        if(!selectedId) return alert("Select a record first.");
        const idx = tenants.findIndex(t => t.id === selectedId);
        if(idx !== -1) {
            tenants[idx].name = document.getElementById('tenantName').value.trim();
            tenants[idx].phone = document.getElementById('phoneNo').value.trim();
            tenants[idx].email = document.getElementById('emailAddress').value.trim();
            tenants[idx].property = document.getElementById('assignedProperty').value.trim();
            tenants[idx].houseNo = document.getElementById('houseNumber').value.trim();
            alert("Tenant record updated.");
            clearForm();
        }
    });

    // Delete function
    document.getElementById('deleteBtn').addEventListener('click', () => {
        if(!selectedId) return alert("Select a record first.");
        if(confirm("Delete this tenant record?")) {
            tenants = tenants.filter(t => t.id !== selectedId);
            clearForm();
        }
    });

    function clearForm() {
        selectedId = null;
        document.getElementById('tenantId').value = '';
        document.getElementById('tenantName').value = '';
        document.getElementById('phoneNo').value = '';
        document.getElementById('emailAddress').value = '';
        document.getElementById('assignedProperty').value = '';
        document.getElementById('houseNumber').value = '';
        renderTable();
    }

    renderTable();
</script>
</body>
</html>
