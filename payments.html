<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent House System - Payments</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h2 {
            color: #007acc;
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            border-color: #007acc;
            outline: none;
        }
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 24px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-add { background-color: #28a745; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-update { background-color: #ffc107; color: #111; }
        .btn-dash { background-color: #6c757d; color: white; margin-left: auto; }
        
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #252525;
            color: #007acc;
        }
        tr:hover {
            background-color: #2a2a2a;
            cursor: pointer;
        }
        tr.selected {
            background-color: #007acc33 !important;
            border-left: 4px solid #007acc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Payment Records Management</h2>
    
    <div class="form-grid">
        <input type="hidden" id="paymentId">
        <div class="input-group">
            <label>TENANT NAME</label>
            <input type="text" id="tenantName" required>
        </div>
        <div class="input-group">
            <label>PROPERTY NAME</label>
            <input type="text" id="propertyName" required>
        </div>
        <div class="input-group">
            <label>AMOUNT</label>
            <input type="number" id="amount" required>
        </div>
        <div class="input-group">
            <label>DATE</label>
            <input type="date" id="paymentDate" required>
        </div>
        <div class="input-group">
            <label>STATUS</label>
            <select id="status">
                <option value="Paid">Paid</option>
                <option value="Unpaid">Unpaid</option>
                <option value="Pending">Pending</option>
            </select>
        </div>
    </div>

    <div class="actions-bar">
        <button class="btn-add" id="btnAdd">Add Payment</button>
        <button class="btn-update" id="btnUpdate">Update Selected</button>
        <button class="btn-delete" id="btnDelete">Delete Record</button>
        <button class="btn-dash" onclick="location.href='dashboard.html'">Dashboard</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tenant Name</th>
                    <th>Property Name</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="paymentsTableBody">
                <!-- Data array bindings print lines dynamically here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // State collection array matching your old Form7 layout properties
    let paymentRecords = JSON.parse(localStorage.getItem('payments')) || [
        { id: 1, tenantname: "Vincent Muhindi", propertyname: "Kingcom", amount: 42000, date: "2026-10-20", status: "Unpaid" }
    ];
    let selectedRowId = null;

    const tableBody = document.getElementById('paymentsTableBody');

    function renderTable() {
        tableBody.innerHTML = '';
        paymentRecords.forEach(record => {
            const tr = document.createElement('tr');
            if(selectedRowId === record.id) tr.classList.add('selected');
            
            tr.innerHTML = `
                <td>${record.id}</td>
                <td>${record.tenantname}</td>
                <td>${record.propertyname}</td>
                <td>Ksh ${record.amount.toLocaleString()}</td>
                <td>${record.date}</td>
                <td>${record.status}</td>
            `;
            
            tr.addEventListener('click', () => selectRow(record));
            tableBody.appendChild(tr);
        });
        localStorage.setItem('payments', JSON.stringify(paymentRecords));
    }

    function selectRow(record) {
        selectedRowId = record.id;
        document.getElementById('paymentId').value = record.id;
        document.getElementById('tenantName').value = record.tenantname;
        document.getElementById('propertyName').value = record.propertyname;
        document.getElementById('amount').value = record.amount;
        document.getElementById('paymentDate').value = record.date;
        document.getElementById('status').value = record.status;
        renderTable();
    }

    function clearForm() {
        selectedRowId = null;
        document.getElementById('paymentId').value = '';
        document.getElementById('tenantName').value = '';
        document.getElementById('propertyName').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('paymentDate').value = '';
        document.getElementById('status').value = 'Paid';
        renderTable();
    }

    document.getElementById('btnAdd').addEventListener('click', () => {
        const tenant = document.getElementById('tenantName').value;
        const property = document.getElementById('propertyName').value;
        const amt = document.getElementById('amount').value;
        const date = document.getElementById('paymentDate').value;
        const stat = document.getElementById('status').value;

        if(!tenant || !property || !amt || !date) return alert("Fill out all parameters.");

        const newRecord = {
            id: paymentRecords.length ? Math.max(...paymentRecords.map(r=>r.id)) + 1 : 1,
            tenantname: tenant,
            propertyname: property,
            amount: Number(amt),
            date: date,
            status: stat
        };

        paymentRecords.push(newRecord);
        alert("Payment recorded successfully.");
        clearForm();
    });

    document.getElementById('btnUpdate').addEventListener('click', () => {
        if(!selectedRowId) return alert("Please select a payment record to update.");

        const idx = paymentRecords.findIndex(r => r.id === selectedRowId);
        if(idx !== -1) {
            paymentRecords[idx].tenantname = document.getElementById('tenantName').value;
            paymentRecords[idx].propertyname = document.getElementById('propertyName').value;
            paymentRecords[idx].amount = Number(document.getElementById('amount').value);
            paymentRecords[idx].date = document.getElementById('paymentDate').value;
            paymentRecords[idx].status = document.getElementById('status').value;
            
            alert("Payment record updated successfully.");
            clearForm();
        }
    });

    document.getElementById('btnDelete').addEventListener('click', () => {
        if(!selectedRowId) return alert("Please select a payment record to delete.");

        if(confirm("Are you sure you want to delete this payment record?")) {
            paymentRecords = paymentRecords.filter(r => r.id !== selectedRowId);
            alert("Payment record deleted successfully.");
            clearForm();
        }
    });

    renderTable();
</script>
</body>
</html>
