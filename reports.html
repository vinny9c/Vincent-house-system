<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent House System - Financial & Operational Reports</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h2 {
            color: #007acc;
            margin: 0;
        }
        .btn-dash {
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            background-color: #6c757d;
            color: white;
            cursor: pointer;
        }
        
        /* Summary Metrics Cards Grid Component */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .metric-card {
            background-color: #252525;
            padding: 20px;
            border-radius: 6px;
            border-top: 4px solid #007acc;
            text-align: center;
        }
        .metric-card.success { border-top-color: #28a745; }
        .metric-card.warning { border-top-color: #ffc107; }
        .metric-title {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .metric-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Detail Breakdown Lists */
        .report-section {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        h3 {
            margin-top: 0;
            color: #007acc;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #252525;
            font-size: 0.95rem;
        }
        .data-row:last-child { border-bottom: none; }
        .status-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-paid { background-color: #28a74533; color: #28a745; }
        .badge-unpaid { background-color: #dc354533; color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>System Insights & Reports</h2>
        <button class="btn-dash" onclick="location.href='dashboard.html'">DASHBOARD</button>
    </div>
    
    <!-- Operational High Level Metric Aggregators -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-title">Total Properties</div>
            <div class="metric-value" id="countProps">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Active Tenants</div>
            <div class="metric-value" id="countTenants">0</div>
        </div>
        <div class="metric-card success">
            <div class="metric-title">Total Collected</div>
            <div class="metric-value" id="sumPayments">Ksh 0</div>
        </div>
        <div class="metric-card warning">
            <div class="metric-title">Landlords Linked</div>
            <div class="metric-value" id="countLandlords">0</div>
        </div>
    </div>

    <!-- Section: Recent Revenue Transaction Log Statement -->
    <div class="report-section">
        <h3>Recent Payment Ledger</h3>
        <div id="paymentsLedgerContainer">
            <!-- Dynamic data print lines map here -->
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // Collect parsing structures from sibling module datasets inside the system memory context
        const props = JSON.parse(localStorage.getItem('properties')) || [];
        const tenants = JSON.parse(localStorage.getItem('tenants')) || [];
        const payments = JSON.parse(localStorage.getItem('payments')) || [];
        const landlords = JSON.parse(localStorage.getItem('landlords')) || [];

        // Compute numerical calculation aggregations
        document.getElementById('countProps').innerText = props.length;
        document.getElementById('countTenants').innerText = tenants.length;
        document.getElementById('countLandlords').innerText = landlords.length;

        const totalRevenue = payments
            .filter(p => p.status.toLowerCase() === 'paid')
            .reduce((sum, current) => sum + current.amount, 0);
        
        document.getElementById('sumPayments').innerText = `Ksh ${totalRevenue.toLocaleString()}`;

        // Populate recent transaction preview logs
        const ledgerContainer = document.getElementById('paymentsLedgerContainer');
        if (payments.length === 0) {
            ledgerContainer.innerHTML = `<div class="data-row" style="color:#aaa;">No historical billing statements located inside this browser session instance.</div>`;
        } else {
            payments.slice(-5).reverse().forEach(p => {
                const row = document.createElement('div');
                row.className = 'data-row';
                const badgeClass = p.status.toLowerCase() === 'paid' ? 'badge-paid' : 'badge-unpaid';
                
                row.innerHTML = `
                    <span><strong>${p.tenantname}</strong> (${p.propertyname})</span>
                    <span>Ksh ${p.amount.toLocaleString()} — <span class="status-badge ${badgeClass}">${p.status}</span></span>
                `;
                ledgerContainer.appendChild(row);
            });
        }
    });
</script>
</body>
</html>
