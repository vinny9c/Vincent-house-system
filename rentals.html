<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent House System - Rentals Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #007acc;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        input:focus, select:focus {
            border-color: #007acc;
            outline: none;
        }
        .btn-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-add { background-color: #28a745; color: white; }
        .btn-update { background-color: #ffc107; color: #111; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-dash { background-color: #6c757d; color: white; margin-left: auto; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { color: #007acc; background-color: #252525; }
        tr:hover { background-color: #2a2a2a; cursor: pointer; }
        tr.selected { background-color: #007acc33 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Manage Rentals</h2>
    
    <div class="form-grid">
        <input type="hidden" id="rentalId">
        <div class="input-group">
            <label>PROPERTY</label>
            <input type="text" id="property">
        </div>
        <div class="input-group">
            <label>HOUSE NO.</label>
            <input type="text" id="houseNo">
        </div>
        <div class="input-group">
            <label>MONTHLY RENT</label>
            <input type="number" id="monthlyRent">
        </div>
        <div class="input-group">
            <label>STATUS</label>
            <select id="status">
                <option value="vacant">Vacant</option>
                <option value="taken">Taken</option>
            </select>
        </div>
    </div>

    <div class="btn-bar">
        <button class="btn-add" id="addBtn">ADD</button>
        <button class="btn-update" id="updateBtn">UPDATE</button>
        <button class="btn-delete" id="deleteBtn">DELETE</button>
        <button class="btn-dash" onclick="location.href='dashboard.html'">DASHBOARD</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Property</th>
                <th>House No.</th>
                <th>Rent</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="rentalsTable">
            <!-- Data row structures populate dynamically -->
        </tbody>
    </table>
</div>

<script>
    // Local mock registry storage mapping from your old Rentals backend records
    let rentals = JSON.parse(localStorage.getItem('rentals')) || [
        { id: 1, property: "Kingcom Penthouses", houseNo: "H-0003", rent: 25000, status: "vacant" }
    ];
    let selectedId = null;

    const tableBody = document.getElementById('rentalsTable');

    function renderTable() {
        tableBody.innerHTML = '';
        rentals.forEach(r => {
            const tr = document.createElement('tr');
            if(selectedId === r.id) tr.classList.add('selected');
            tr.innerHTML = `<td>${r.property}</td><td>${r.houseNo}</td><td>Ksh ${r.rent}</td><td>${r.status}</td>`;
            
            // Replicates DataGrid1_Click state mapping synchronizer loop
            tr.addEventListener('click', () => {
                selectedId = r.id;
                document.getElementById('rentalId').value = r.id;
                document.getElementById('property').value = r.property;
                document.getElementById('houseNo').value = r.houseNo;
                document.getElementById('monthlyRent').value = r.rent;
                document.getElementById('status').value = r.status;
                renderTable();
            });
            tableBody.appendChild(tr);
        });
        localStorage.setItem('rentals', JSON.stringify(rentals));
    }

    // Command1_Click Hook: INSERT record operational item execution logic
    document.getElementById('addBtn').addEventListener('click', () => {
        const prop = document.getElementById('property').value.trim();
        const house = document.getElementById('houseNo').value.trim();
        if(!prop || !house) return alert("Please specify the target parameters.");
        
        rentals.push({
            id: Date.now(),
            property: prop,
            houseNo: house,
            rent: Number(document.getElementById('monthlyRent').value),
            status: document.getElementById('status').value
        });
        alert("Data added successfully");
        clearForm();
    });

    // Command2_Click Hook: UPDATE record properties condition
    document.getElementById('updateBtn').addEventListener('click', () => {
        if(!selectedId) return alert("Please select a rental to update.");
        const idx = rentals.findIndex(r => r.id === selectedId);
        if(idx !== -1) {
            rentals[idx].property = document.getElementById('property').value.trim();
            rentals[idx].houseNo = document.getElementById('houseNo').value.trim();
            rentals[idx].rent = Number(document.getElementById('monthlyRent').value);
            rentals[idx].status = document.getElementById('status').value;
            alert("Data updated successfully.");
            clearForm();
        }
    });

    // Command3_Click Hook: DELETE data record mapping verification logic
    document.getElementById('deleteBtn').addEventListener('click', () => {
        if(!selectedId) return alert("Please select a rental to delete.");
        if(confirm("Are you sure you want to delete this rental?")) {
            rentals = rentals.filter(r => r.id !== selectedId);
            alert("Data deleted successfully.");
            clearForm();
        }
    });

    function clearForm() {
        selectedId = null;
        document.getElementById('rentalId').value = '';
        document.getElementById('property').value = '';
        document.getElementById('houseNo').value = '';
        document.getElementById('monthlyRent').value = '';
        document.getElementById('status').value = 'vacant';
        renderTable();
    }

    // Fire data grid configuration
    renderTable();
</script>
</body>
</html>
